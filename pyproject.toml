[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-crawler"
version = "0.2.0"
description = "Configurable conference paper crawler with Zotero local API integration."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "soupsieve>=2.5",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
paper-crawler = "paper_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["paper_crawler*"]
